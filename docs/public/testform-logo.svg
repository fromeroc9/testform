<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="tf-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Rim Gradients -->
    <linearGradient id="tf-neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <linearGradient id="tf-neon-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Facet Material Shaders -->
    <linearGradient id="tf-mat-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="tf-mat-top-bright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="tf-mat-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="tf-mat-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2038" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>

    <linearGradient id="tf-front-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="tf-front-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#13233f" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="50" cy="50" r="42" fill="url(#tf-ambient)" />

  <!-- 1. BACK / TOP-CENTER BLOCK -->
  <g id="block-back">
    <path d="M 38 18 L 50 25 L 50 39 L 38 32 Z" fill="url(#tf-mat-left)" stroke="#1e293b" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 50 25 L 62 18 L 62 32 L 50 39 Z" fill="url(#tf-mat-right)" stroke="#0284c7" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 50 11 L 62 18 L 50 25 L 38 18 Z" fill="url(#tf-mat-top)" stroke="url(#tf-neon-indigo)" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- 2. TOP-LEFT WING BLOCK -->
  <g id="block-left">
    <path d="M 11 33.5 L 23 40.5 L 23 55.5 L 11 48.5 Z" fill="url(#tf-mat-left)" stroke="#1e293b" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 23 40.5 L 35 33.5 L 35 48.5 L 23 55.5 Z" fill="url(#tf-mat-right)" stroke="#0284c7" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 23 26.5 L 35 33.5 L 23 40.5 L 11 33.5 Z" fill="url(#tf-mat-top)" stroke="url(#tf-neon-indigo)" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- 3. TOP-RIGHT WING BLOCK -->
  <g id="block-right">
    <path d="M 65 33.5 L 77 40.5 L 77 55.5 L 65 48.5 Z" fill="url(#tf-mat-left)" stroke="#1e293b" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 77 40.5 L 89 33.5 L 89 48.5 L 77 55.5 Z" fill="url(#tf-mat-right)" stroke="#38bdf8" stroke-width="0.8" stroke-linejoin="round" />
    <path d="M 77 26.5 L 89 33.5 L 77 40.5 L 65 33.5 Z" fill="url(#tf-mat-top)" stroke="url(#tf-neon-cyan)" stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- 4. FRONT-CENTER PILLAR (The Stem of the T) -->
  <g id="block-front-pillar">
    <path d="M 38 51 L 50 58 L 50 91 L 38 84 Z" fill="url(#tf-front-left)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" stroke-linejoin="round" />
    <path d="M 50 58 L 62 51 L 62 84 L 50 91 Z" fill="url(#tf-front-right)" fill-opacity="0.9" stroke="url(#tf-neon-cyan)" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M 50 44 L 62 51 L 50 58 L 38 51 Z" fill="url(#tf-mat-top-bright)" stroke="url(#tf-neon-cyan)" stroke-width="1.5" stroke-linejoin="round" />
  </g>

  <!-- Isometric Node Edge Accents -->
  <line x1="50" y1="58" x2="50" y2="91" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
  <line x1="50" y1="25" x2="50" y2="39" stroke="#818cf8" stroke-width="1.2" stroke-linecap="round" />
</svg>
